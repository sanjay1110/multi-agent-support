<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>ShopCo Support</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <span class="logo" aria-hidden="true">S</span>
        <div>
          <h1>ShopCo Support</h1>
          <p class="sub" id="who">Not connected</p>
        </div>
      </div>
      <button class="ghost" id="settingsBtn" type="button" aria-controls="settings" aria-expanded="false">Settings</button>
    </header>

    <section class="settings" id="settings" hidden>
      <form id="settingsForm" autocomplete="off">
        <label for="key">Access key</label>
        <div class="row">
          <input id="key" type="password" inputmode="text" spellcheck="false"
                 autocapitalize="off" placeholder="Paste the access key" required>
          <button class="ghost small" id="showKey" type="button" aria-pressed="false">Show</button>
        </div>

        <label for="customer">Demo customer</label>
        <select id="customer">
          <option value="C-001">C-001 · Priya Shah</option>
          <option value="C-002">C-002 · Marcus Lee</option>
          <option value="C-003">C-003 · Ana Gomez</option>
          <option value="C-004">C-004 · Tom Becker</option>
          <option value="C-005">C-005 · Lena Park</option>
        </select>

        <label class="check"><input id="remember" type="checkbox" checked> Remember key on this device</label>

        <div class="row end">
          <button class="ghost small" id="forget" type="button">Forget key</button>
          <button class="primary" type="submit">Start chat</button>
        </div>
        <p class="hint">Demo only: the customer is chosen here, not by login.</p>
      </form>
    </section>

    <main class="log" id="log" aria-live="polite">
      <div class="empty" id="empty">
        <p>Ask about an order, a refund or shipping insurance.</p>
        <div class="chips" id="chips">
          <button type="button" class="chip">Where is ORD-1002?</button>
          <button type="button" class="chip">I'd like a refund for ORD-1001</button>
          <button type="button" class="chip">Is ORD-1001 covered by shipping insurance?</button>
        </div>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea id="msg" rows="1" maxlength="4000" placeholder="Type a message" aria-label="Message" required></textarea>
      <button class="primary send" id="send" type="submit" aria-label="Send">Send</button>
    </form>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
